name: Refresh profile charts

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/update_profile.py"
      - ".github/workflows/profile-charts.yml"

permissions:
  contents: write

concurrency:
  group: profile-charts
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate charts from public data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/update_profile.py
      - name: Save updated charts
        shell: bash
        run: |
          git add assets/generated/
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh public profile charts"
          git pull --rebase origin main
          git push origin HEAD:main
